<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4d23" />
      <stop offset="100%" stop-color="#ff7a45" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff5f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Iconic Illdoor Arch / Door "D" Mark -->
  <g filter="url(#shadow)">
    <!-- Outer White Arch Door -->
    <path d="M152 108 H258 C350 108 404 168 404 256 C404 344 350 404 258 404 H152 Z" fill="url(#doorGrad)" />
    
    <!-- Inner Orange Cutout Arch -->
    <path d="M206 160 H252 C308 160 346 196 346 256 C346 316 308 352 252 352 H206 Z" fill="#ef4d23" />

    <!-- Door Handle Gem / Accent -->
    <circle cx="282" cy="256" r="16" fill="#ffffff" />
    <circle cx="282" cy="256" r="8" fill="#ff7a45" />
  </g>
</svg>
