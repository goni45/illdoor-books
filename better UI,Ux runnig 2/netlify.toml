[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — refresh / deep links always resolve to index.html instead of 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
